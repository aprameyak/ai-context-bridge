<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 400px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #333;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 16px;
      text-align: center;
    }
    
    .header h2 {
      font-size: 18px;
      margin-bottom: 4px;
    }
    
    .header p {
      font-size: 12px;
      opacity: 0.9;
    }
    
    .content {
      padding: 16px;
    }
    
    .status {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 16px;
    }
    
    .status-label {
      font-size: 12px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .status-value {
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
      color: #333;
    }
    
    .status-value.detected {
      color: #22c55e;
    }
    
    .status-value.error {
      color: #ef4444;
    }
    
    .button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 8px;
    }
    
    .button-primary {
      background: #667eea;
      color: white;
    }
    
    .button-primary:hover {
      background: #5568d3;
    }
    
    .button-primary:active {
      transform: scale(0.98);
    }
    
    .button-primary:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    
    .button-secondary {
      background: white;
      color: #667eea;
      border: 1px solid #667eea;
    }
    
    .button-secondary:hover {
      background: #f5f5ff;
    }
    
    .info {
      background: #f0f4ff;
      border-left: 3px solid #667eea;
      padding: 12px;
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.5;
      color: #555;
    }
    
    .conversation-preview {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      max-height: 200px;
      overflow-y: auto;
      font-size: 12px;
    }
    
    .conversation-preview p {
      margin-bottom: 8px;
      line-height: 1.4;
    }
    
    .conversation-preview p:last-child {
      margin-bottom: 0;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
    }
    
    .spinner {
      border: 2px solid #f0f0f0;
      border-top: 2px solid #667eea;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>AI Context Bridge</h2>
    <p>Transfer conversations seamlessly</p>
  </div>
  
  <div class="content">
    <div class="status">
      <div class="status-label">Current Provider</div>
      <div class="status-value" id="provider">Detecting...</div>
    </div>
    
    <div style="background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 16px;">
      <div class="status-label">Behavior Mode</div>
      <select id="modeSelect" style="width: 100%; padding: 8px; margin-top: 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 13px;">
        <option value="normal">Normal (No modification)</option>
        <option value="terse">Be Terse - No fluff, straight answers</option>
        <option value="honest">Be Honest - Admit uncertainty, don't guess</option>
        <option value="direct">Be Direct - Answer only what I ask</option>
        <option value="noflat">Stop Flattery - Cut the excessive praise</option>
        <option value="challenge">Challenge Me - Find flaws in my thinking</option>
        <option value="risks">Risk-First - Lead with downsides</option>
        <option value="assume">Make Assumptions - Don't ask endless questions</option>
      </select>
    </div>

    <button class="button button-primary" id="extractBtn" disabled>
      Extract Conversation
    </button>

    <button class="button button-secondary" id="applyModeBtn" disabled style="background: #fff8e1; border: 1px solid #fbbf24; color: #92400e;">
      Apply Mode to This Chat
    </button>

    <div class="info">
      <strong>Two ways to use:</strong><br>
      <strong style="color: #555;">Transfer + Mode:</strong> Extract → Switch provider → Paste<br>
      <strong style="color: #555;">Apply Mode:</strong> Change AI behavior in current chat instantly
    </div>
    
    <div class="conversation-preview" id="preview" style="display: none;"></div>
  </div>
</body>
<script src="popup.js"></script>
</html>
